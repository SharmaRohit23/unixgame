<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UXO GAMES — Terminal Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04050a;
    --void-2:#080b14;
    --panel:rgba(12,18,32,0.55);
    --cyan:#37e6ff;
    --cyan-dim:#1a5a66;
    --violet:#a35bff;
    --steel:#9fb2c4;
    --steel-dim:#4c5a6b;
    --paper:#eaf6ff;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}

  body{
    background:var(--void);
    color:var(--steel);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding:28px;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(163,91,255,0.14), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(55,230,255,0.12), transparent 55%);
    z-index:0;
  }

  .grid-floor{
    position:fixed;
    left:0; right:0; bottom:0;
    height:50vh;
    background-image:
      linear-gradient(rgba(55,230,255,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(55,230,255,0.16) 1px, transparent 1px);
    background-size:52px 52px;
    transform:perspective(300px) rotateX(74deg);
    transform-origin:bottom;
    mask-image:linear-gradient(to top, black, transparent);
    -webkit-mask-image:linear-gradient(to top, black, transparent);
    opacity:0.5;
    z-index:1;
    animation:drift 8s linear infinite;
  }

  @keyframes drift{
    from{background-position:0 0, 0 0;}
    to{background-position:0 52px, 52px 0;}
  }

  .scan-sweep{
    position:fixed;
    left:0; right:0;
    height:120px;
    background:linear-gradient(to bottom, transparent, rgba(55,230,255,0.06), transparent);
    z-index:2;
    pointer-events:none;
    animation:sweep 6s ease-in-out infinite;
  }

  @keyframes sweep{
    0%{ top:-120px; }
    50%{ top:100%; }
    100%{ top:-120px; }
  }

  .stage{
    position:relative;
    z-index:10;
    width:100%;
    max-width:640px;
    padding:56px 46px;
    text-align:center;
    background:var(--panel);
    backdrop-filter:blur(10px);
    border:1px solid rgba(55,230,255,0.22);
    box-shadow:
      0 0 0 1px rgba(55,230,255,0.06) inset,
      0 0 60px rgba(55,230,255,0.08);
  }

  .stage::before,.stage::after,.br-tr,.br-bl{
    content:"";
    position:absolute;
    width:30px;
    height:30px;
    border:2px solid var(--cyan);
    filter:drop-shadow(0 0 6px rgba(55,230,255,0.7));
  }
  .stage::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .stage::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .br-tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .br-bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; }

  .status-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:11.5px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--steel-dim);
    margin-bottom:26px;
  }

  .status-dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 10px var(--cyan);
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.2;}
  }

  .core{
    position:relative;
    width:190px;
    height:190px;
    margin:0 auto 8px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .core .ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(55,230,255,0.35);
  }
  .core .ring.r1{ width:100%; height:100%; border-style:dashed; animation:spin 18s linear infinite; }
  .core .ring.r2{ width:76%; height:76%; border-color:rgba(163,91,255,0.4); animation:spin 12s linear infinite reverse; }
  .core .ring.r3{ width:54%; height:54%; border-color:rgba(55,230,255,0.55); animation:spin 24s linear infinite; }

  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  .core .glyph{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.1em;
    color:var(--cyan);
    text-shadow:0 0 12px rgba(55,230,255,0.8);
  }

  .brand{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:clamp(2.2rem, 8vw, 3.6rem);
    letter-spacing:0.06em;
    line-height:1.1;
    color:var(--paper);
    text-transform:uppercase;
    text-shadow:0 0 18px rgba(55,230,255,0.35);
    margin-top:6px;
  }

  .brand .uxo{
    background:linear-gradient(90deg, var(--cyan), var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    font-family:'Rajdhani', sans-serif;
    font-size:17px;
    font-weight:500;
    letter-spacing:0.02em;
    color:var(--steel);
    max-width:440px;
    margin:18px auto 0;
    line-height:1.6;
  }

  .telemetry{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:34px;
    padding-top:22px;
    border-top:1px solid rgba(55,230,255,0.16);
    flex-wrap:wrap;
  }

  .telemetry .stat{ text-align:left; min-width:96px; }

  .telemetry .stat .label{
    font-size:10px;
    letter-spacing:0.22em;
    color:var(--steel-dim);
    text-transform:uppercase;
  }

  .telemetry .stat .value{
    font-family:'Rajdhani', sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--cyan);
    margin-top:4px;
  }

  .arm-wrap{
    margin-top:42px;
    position:relative;
    display:inline-block;
  }

  .play-btn{
    position:relative;
    z-index:2;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--void);
    background:linear-gradient(90deg, var(--cyan), #6fd8ff);
    border:none;
    padding:18px 56px;
    cursor:pointer;
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    overflow:hidden;
    transition:transform 0.15s ease, box-shadow 0.2s ease;
    box-shadow:0 0 24px rgba(55,230,255,0.35);
  }

  .play-btn .fill{
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, var(--violet), #ff6fd8);
    transform:translateX(-100%);
    z-index:-1;
  }

  .play-btn.arming .fill{
    animation:fillbar 0.85s linear forwards;
  }

  @keyframes fillbar{
    to{ transform:translateX(0); }
  }

  .play-btn:hover{
    box-shadow:0 0 42px rgba(55,230,255,0.6);
    transform:translateY(-2px);
  }

  .play-btn:active{ transform:translateY(0); }

  .play-btn:focus-visible{
    outline:3px solid var(--paper);
    outline-offset:5px;
  }

  .btn-caption{
    margin-top:14px;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--steel-dim);
    text-transform:uppercase;
    min-height:16px;
  }

  .btn-caption.warn{ color:var(--violet); }

  footer{
    margin-top:32px;
    font-size:10.5px;
    letter-spacing:0.2em;
    color:var(--steel-dim);
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    .grid-floor, .scan-sweep, .status-dot, .core .ring, .play-btn.arming .fill{
      animation:none !important;
    }
  }

  @media (max-width:480px){
    .stage{ padding:44px 22px; }
    .play-btn{ padding:16px 40px; font-size:16px; }
    .telemetry{ gap:20px; }
    .core{ width:150px; height:150px; }
  }
</style>
</head>
<body>

  <div class="grid-floor"></div>
  <div class="scan-sweep"></div>

  <main class="stage">
    <div class="br-tr"></div>
    <div class="br-bl"></div>

    <div class="status-row">
      <span class="status-dot"></span> Terminal Online
    </div>

    <div class="core" aria-hidden="true">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <span class="glyph">UXO</span>
    </div>

    <h1 class="brand"><span class="uxo">UXO</span> GAMES</h1>

    <p class="tagline">
      Precision play from another orbit. Sync the terminal below to enter
      the main network.
    </p>

    <div class="telemetry">
      <div class="stat">
        <div class="label">Status</div>
        <div class="value" id="statStatus">Ready</div>
      </div>
      <div class="stat">
        <div class="label">Session</div>
        <div class="value" id="statSession">#00184</div>
      </div>
      <div class="stat">
        <div class="label">Uplink</div>
        <div class="value" id="statUplink">Stable</div>
      </div>
    </div>

    <div class="arm-wrap">
      <button class="play-btn" id="playBtn">
        <span class="fill" aria-hidden="true"></span>
        <span class="label-text">Play Now</span>
      </button>
    </div>
    <p class="btn-caption" id="caption">Click to sync and launch session</p>

    <footer>© UXO GAMES — Signal Locked</footer>
  </main>

<script>
  // ---------------------------------------------------------
  // EDIT THIS: put the URL of your main website/game here
  // ---------------------------------------------------------
  const REDIRECT_URL = "https://uxogames.com";
  // ---------------------------------------------------------

  const btn = document.getElementById('playBtn');
  const caption = document.getElementById('caption');
  const statStatus = document.getElementById('statStatus');

  btn.addEventListener('click', function () {
    if (btn.classList.contains('arming')) return;
    btn.classList.add('arming');
    caption.textContent = 'Syncing terminal...';
    caption.classList.add('warn');
    statStatus.textContent = 'Synced';
    btn.disabled = true;

    setTimeout(function () {
      caption.textContent = 'Launching...';
      window.location.href = REDIRECT_URL;
    }, 850);
  });

  // small live "session id" tick, purely cosmetic
  let n = 184;
  setInterval(function () {
    n += Math.floor(Math.random() * 2);
    document.getElementById('statSession').textContent = '#' + String(n).padStart(5, '0');
  }, 3200);
</script>

</body>
</html>
