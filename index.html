<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS ARCADE — Insert Coin</title>
<style>
  :root{
    --void:#08090b;
    --void-2:#0e1013;
    --phosphor:#3dff8a;
    --phosphor-dim:#1c6b3f;
    --magenta:#ff2e88;
    --amber:#ffb020;
    --ash:#8a9296;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:var(--void);
    overflow-x:hidden;
  }

  body{
    font-family:'Courier New', monospace;
    color:var(--ash);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
    padding:24px;
  }

  /* ambient scanlines + vignette */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:5;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);
    z-index:4;
  }

  .grid-floor{
    position:fixed;
    left:0; right:0; bottom:0;
    height:45vh;
    background-image:
      linear-gradient(rgba(61,255,138,0.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,255,138,0.14) 1px, transparent 1px);
    background-size:48px 48px;
    transform:perspective(280px) rotateX(72deg);
    transform-origin:bottom;
    mask-image:linear-gradient(to top, black, transparent);
    -webkit-mask-image:linear-gradient(to top, black, transparent);
    opacity:0.55;
    z-index:1;
  }

  .cabinet{
    position:relative;
    z-index:10;
    width:100%;
    max-width:640px;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--phosphor-dim);
    margin-bottom:28px;
    text-transform:uppercase;
  }

  .eyebrow .dot{
    width:6px;height:6px;
    background:var(--phosphor);
    border-radius:50%;
    box-shadow:0 0 8px var(--phosphor);
    animation:blink 1.4s steps(1) infinite;
  }

  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0.15;}
  }

  h1{
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:clamp(2.6rem, 9vw, 5rem);
    line-height:0.95;
    letter-spacing:0.02em;
    color:#eafff2;
    text-shadow:
      0 0 6px rgba(61,255,138,0.6),
      0 0 22px rgba(61,255,138,0.35);
    position:relative;
    display:inline-block;
    animation:flicker 5s infinite;
  }

  h1 .glitch-layer{
    position:absolute;
    top:0;left:0;
    width:100%;
    clip-path:inset(0 0 0 0);
  }

  h1 .glitch-layer.magenta{
    color:var(--magenta);
    text-shadow:none;
    animation:glitch-m 3.2s infinite linear alternate-reverse;
    opacity:0.7;
  }

  h1 .glitch-layer.amber{
    color:var(--amber);
    text-shadow:none;
    animation:glitch-a 2.6s infinite linear alternate-reverse;
    opacity:0.55;
  }

  @keyframes glitch-m{
    0%{clip-path:inset(0 0 88% 0); transform:translate(-2px,0);}
    20%{clip-path:inset(30% 0 45% 0); transform:translate(2px,0);}
    40%{clip-path:inset(70% 0 5% 0); transform:translate(-1px,0);}
    60%{clip-path:inset(10% 0 70% 0); transform:translate(2px,0);}
    80%{clip-path:inset(55% 0 20% 0); transform:translate(-2px,0);}
    100%{clip-path:inset(0 0 90% 0); transform:translate(1px,0);}
  }

  @keyframes glitch-a{
    0%{clip-path:inset(60% 0 10% 0); transform:translate(2px,0);}
    25%{clip-path:inset(5% 0 80% 0); transform:translate(-2px,0);}
    50%{clip-path:inset(40% 0 40% 0); transform:translate(1px,0);}
    75%{clip-path:inset(85% 0 2% 0); transform:translate(-1px,0);}
    100%{clip-path:inset(20% 0 60% 0); transform:translate(2px,0);}
  }

  @keyframes flicker{
    0%,3%,5%,7%,100%{opacity:1;}
    4%{opacity:0.75;}
    6%{opacity:0.9;}
  }

  .subtitle{
    margin-top:22px;
    font-size:14px;
    letter-spacing:0.08em;
    color:var(--ash);
    line-height:1.7;
    max-width:440px;
    margin-left:auto;
    margin-right:auto;
  }

  .boot-line{
    margin-top:36px;
    font-size:12px;
    color:var(--phosphor-dim);
    letter-spacing:0.05em;
    min-height:18px;
  }

  .boot-line .cursor{
    display:inline-block;
    width:8px;
    background:var(--phosphor);
    margin-left:2px;
    animation:blink 0.9s steps(1) infinite;
  }

  .play-btn{
    margin-top:44px;
    position:relative;
    display:inline-block;
    padding:18px 52px;
    font-family:'Courier New', monospace;
    font-size:18px;
    font-weight:700;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--void);
    background:var(--phosphor);
    border:none;
    cursor:pointer;
    clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    box-shadow:0 0 24px rgba(61,255,138,0.45);
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .play-btn:hover{
    background:#7dffb4;
    box-shadow:0 0 38px rgba(61,255,138,0.75);
    transform:translateY(-2px);
  }

  .play-btn:active{
    transform:translateY(1px) scale(0.98);
    box-shadow:0 0 14px rgba(61,255,138,0.4);
  }

  .play-btn:focus-visible{
    outline:3px solid var(--amber);
    outline-offset:4px;
  }

  .meta-row{
    margin-top:20px;
    font-size:11px;
    letter-spacing:0.1em;
    color:#4c5457;
  }

  .credits{
    margin-top:6px;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--phosphor-dim);
  }

  @media (prefers-reduced-motion: reduce){
    h1, .glitch-layer, .eyebrow .dot, .boot-line .cursor{
      animation:none !important;
    }
  }

  @media (max-width:480px){
    .play-btn{padding:16px 36px; font-size:16px;}
  }
</style>
</head>
<body>

  <div class="grid-floor"></div>

  <main class="cabinet">
    <div class="eyebrow"><span class="dot"></span> SYSTEM READY</div>

    <h1>
      NEXUS
      <span class="glitch-layer magenta" aria-hidden="true">NEXUS</span>
      <span class="glitch-layer amber" aria-hidden="true">NEXUS</span>
    </h1>

    <p class="subtitle">
      A new arena is live. Sharper reflexes, faster matches, higher stakes.
      Step through the terminal to enter the main grid.
    </p>

    <p class="boot-line" id="bootLine">&gt; awaiting player input<span class="cursor">&nbsp;</span></p>

    <button class="play-btn" id="playBtn">Play Now</button>

    <p class="meta-row">PRESS START TO CONTINUE</p>
    <p class="credits">© NEXUS ARCADE</p>
  </main>

<script>
  // ---------------------------------------------------------
  // EDIT THIS: put the URL of your main website/game here
  // ---------------------------------------------------------
  const REDIRECT_URL = "https://uxogames.com";
  // ---------------------------------------------------------

  const btn = document.getElementById('playBtn');
  const boot = document.getElementById('bootLine');

  btn.addEventListener('click', function () {
    boot.innerHTML = '&gt; launching session...<span class="cursor">&nbsp;</span>';
    btn.disabled = true;
    btn.style.opacity = '0.7';
    setTimeout(function () {
      window.location.href = REDIRECT_URL;
    }, 500);
  });
</script>

</body>
</html>
