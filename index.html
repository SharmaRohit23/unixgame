<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UXO GAMES — Standing By</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#121316;
    --charcoal-2:#191b1f;
    --steel:#8b929a;
    --steel-dim:#4d525a;
    --hazard:#ff7a1a;
    --hazard-yellow:#ffc328;
    --alert:#ff3d3d;
    --paper:#f3f1ea;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    background:var(--charcoal);
    color:var(--steel);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding:28px;
  }

  /* hazard stripe bars top & bottom */
  .hazard-bar{
    position:fixed;
    left:0; right:0;
    height:10px;
    background:repeating-linear-gradient(
      -45deg,
      var(--hazard-yellow) 0 18px,
      var(--charcoal-2) 18px 36px
    );
    z-index:20;
  }
  .hazard-bar.top{top:0;}
  .hazard-bar.bottom{bottom:0;}

  /* faint radial grid / blast radius rings behind content */
  .rings{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .rings span{
    position:absolute;
    border:1px solid rgba(255,122,26,0.14);
    border-radius:50%;
  }
  .rings span:nth-child(1){width:340px;height:340px;}
  .rings span:nth-child(2){width:560px;height:560px;}
  .rings span:nth-child(3){width:800px;height:800px;}
  .rings span:nth-child(4){width:1060px;height:1060px;}

  .stage{
    position:relative;
    z-index:10;
    width:100%;
    max-width:620px;
    padding:52px 44px;
    text-align:center;
  }

  /* HUD corner brackets */
  .stage::before,
  .stage::after,
  .bracket-tr,
  .bracket-bl{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    border:2px solid var(--hazard);
    opacity:0.85;
  }
  .stage::before{ top:0; left:0; border-right:none; border-bottom:none; }
  .stage::after{ bottom:0; right:0; border-left:none; border-top:none; }
  .bracket-tr{ top:0; right:0; border-left:none; border-bottom:none; }
  .bracket-bl{ bottom:0; left:0; border-right:none; border-top:none; }

  .status-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--steel-dim);
    margin-bottom:30px;
  }

  .status-dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--hazard-yellow);
    box-shadow:0 0 8px var(--hazard-yellow);
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.25;}
  }

  .brand{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:clamp(2.8rem, 10vw, 5.2rem);
    letter-spacing:0.03em;
    line-height:0.92;
    color:var(--paper);
    text-transform:uppercase;
  }

  .brand .uxo{
    color:var(--hazard);
    position:relative;
  }

  .divider{
    width:120px;
    height:4px;
    margin:20px auto 22px;
    background:repeating-linear-gradient(
      -45deg,
      var(--hazard-yellow) 0 8px,
      var(--charcoal-2) 8px 16px
    );
  }

  .tagline{
    font-family:'Rajdhani', sans-serif;
    font-size:17px;
    font-weight:500;
    letter-spacing:0.03em;
    color:var(--steel);
    max-width:420px;
    margin:0 auto;
    line-height:1.55;
  }

  .telemetry{
    display:flex;
    justify-content:center;
    gap:28px;
    margin-top:34px;
    padding-top:22px;
    border-top:1px solid #2a2d32;
    flex-wrap:wrap;
  }

  .telemetry .stat{
    text-align:left;
    min-width:100px;
  }

  .telemetry .stat .label{
    font-size:10px;
    letter-spacing:0.2em;
    color:var(--steel-dim);
    text-transform:uppercase;
  }

  .telemetry .stat .value{
    font-size:15px;
    color:var(--hazard-yellow);
    margin-top:4px;
    font-weight:500;
  }

  /* the arm / play control */
  .arm-wrap{
    margin-top:40px;
    position:relative;
    display:inline-block;
  }

  .play-btn{
    position:relative;
    z-index:2;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--charcoal);
    background:var(--hazard);
    border:none;
    padding:18px 54px;
    cursor:pointer;
    clip-path:polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    overflow:hidden;
    transition:transform 0.15s ease, box-shadow 0.2s ease, color 0.2s ease;
    box-shadow:0 0 0 rgba(255,122,26,0);
  }

  .play-btn .fill{
    position:absolute;
    inset:0;
    background:var(--hazard-yellow);
    transform:translateX(-100%);
    z-index:-1;
  }

  .play-btn.arming .fill{
    animation:fillbar 0.85s linear forwards;
  }

  @keyframes fillbar{
    to{ transform:translateX(0); }
  }

  .play-btn:hover{
    box-shadow:0 0 26px rgba(255,122,26,0.5);
    transform:translateY(-2px);
  }

  .play-btn:active{
    transform:translateY(0);
  }

  .play-btn:focus-visible{
    outline:3px solid var(--paper);
    outline-offset:5px;
  }

  .btn-caption{
    margin-top:14px;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--steel-dim);
    text-transform:uppercase;
    min-height:16px;
  }

  .btn-caption.warn{
    color:var(--hazard-yellow);
  }

  footer{
    margin-top:30px;
    font-size:10.5px;
    letter-spacing:0.18em;
    color:var(--steel-dim);
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    .status-dot, .play-btn.arming .fill{ animation:none !important; }
  }

  @media (max-width:480px){
    .stage{ padding:44px 22px; }
    .play-btn{ padding:16px 38px; font-size:16px; }
    .telemetry{ gap:20px; }
  }
</style>
</head>
<body>

  <div class="hazard-bar top"></div>
  <div class="hazard-bar bottom"></div>

  <div class="rings" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <main class="stage">
    <div class="bracket-tr"></div>
    <div class="bracket-bl"></div>

    <div class="status-row">
      <span class="status-dot"></span> Standing By
    </div>

    <h1 class="brand"><span class="uxo">UXO</span> GAMES</h1>

    <div class="divider"></div>

    <p class="tagline">
      High-impact play, precision-built. Every session lands where it counts.
      Arm the launcher below to enter the main site.
    </p>

    <div class="telemetry">
      <div class="stat">
        <div class="label">Status</div>
        <div class="value" id="statStatus">Ready</div>
      </div>
      <div class="stat">
        <div class="label">Session</div>
        <div class="value" id="statSession">#00184</div>
      </div>
      <div class="stat">
        <div class="label">Uplink</div>
        <div class="value" id="statUplink">Stable</div>
      </div>
    </div>

    <div class="arm-wrap">
      <button class="play-btn" id="playBtn">
        <span class="fill" aria-hidden="true"></span>
        <span class="label-text">Play Now</span>
      </button>
    </div>
    <p class="btn-caption" id="caption">Click to arm and launch session</p>

    <footer>© UXO GAMES — All Systems Nominal</footer>
  </main>

<script>
  // ---------------------------------------------------------
  // EDIT THIS: put the URL of your main website/game here
  // ---------------------------------------------------------
  const REDIRECT_URL = "https://uxogames.com";
  // ---------------------------------------------------------

  const btn = document.getElementById('playBtn');
  const caption = document.getElementById('caption');
  const statStatus = document.getElementById('statStatus');

  btn.addEventListener('click', function () {
    if (btn.classList.contains('arming')) return;
    btn.classList.add('arming');
    caption.textContent = 'Arming session...';
    caption.classList.add('warn');
    statStatus.textContent = 'Armed';
    btn.disabled = true;

    setTimeout(function () {
      caption.textContent = 'Launching...';
      window.location.href = REDIRECT_URL;
    }, 850);
  });

  // small live "session id" tick, purely cosmetic
  let n = 184;
  setInterval(function () {
    n += Math.floor(Math.random() * 2);
    document.getElementById('statSession').textContent = '#' + String(n).padStart(5, '0');
  }, 3200);
</script>

</body>
</html>
